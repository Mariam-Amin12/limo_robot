
#---standard pioneer footprint---
#---(in meters)---

# Real Limo robot footprint based on URDF dimensions
# Base: 0.13m x 0.12m, Wheelbase: 0.2m, Track: 0.13m, Wheel radius: 0.045m
# Calculated footprint including all wheels and base
footprint: [[-0.145, -0.11], [-0.145, 0.11], [0.145, 0.11], [0.145, -0.11]]
# Add padding for multi-robot collision avoidance
footprint_padding: 0.02

transform_tolerance: 0.5


always_send_full_costmap: true

obstacle_layer:
 enabled: true
 # Increased ranges for better multi-robot collision avoidance
 obstacle_range: 5.0
 raytrace_range: 6.0
 inflation_radius: 0.3
 track_unknown_space: true
 combination_method: 1

 observation_sources: laser_scan_sensor
 laser_scan_sensor: {data_type: LaserScan, topic: scan, marking: true, clearing: true}


inflation_layer:
  enabled:              true
  # Balanced cost scaling for safe navigation
  cost_scaling_factor:  20.0
  # Increased inflation for multi-robot safety
  inflation_radius:     0.3  # Increased to prevent collisions between robots

static_layer:
  enabled:              true
  map_topic:            "map"

laser_scan_sensor:
  sensor_frame: laser_link   
  data_type: LaserScan
  topic: /scan
  marking: true               
  clearing: true              
  min_obstacle_height: 0.0
  max_obstacle_height: 2.0
  obstacle_range: 5.0
  raytrace_range: 6.0