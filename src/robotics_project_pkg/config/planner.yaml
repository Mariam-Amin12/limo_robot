controller_frequency: 5.0
recovery_behaviour_enabled: true

# GlobalPlanner configuration (used in launch file)
GlobalPlanner:
  old_navfn_behavior: false
  use_quadratic: true
  use_dijkstra: true
  use_grid_path: false
  allow_unknown: true  # CRITICAL: Allow planning through unknown space during exploration
  planner_window_x: 0.0
  planner_window_y: 0.0
  default_tolerance: 1.0  # Very large tolerance for tight spaces
  publish_scale: 100
  lethal_cost: 253
  neutral_cost: 50
  cost_factor: 2.0  # Reduced cost factor to allow paths closer to obstacles
  publish_potential: true

NavfnROS:
  allow_unknown: true # Specifies whether or not to allow navfn to create plans that traverse unknown space.
  default_tolerance: 0.1 # A tolerance on the goal point for the planner.

TrajectoryPlannerROS:
  # Robot Configuration Parameters
  acc_lim_x: 2.5
  acc_lim_theta:  3.2

  # Balanced speed for safe and efficient navigation
  max_vel_x: 0.3
  # Minimum velocity for smooth control
  min_vel_x: 0.05

  max_vel_theta: 1.0
  min_vel_theta: -1.0
  min_in_place_vel_theta: 0.2

  holonomic_robot: false
  escape_vel: -0.1

  # Goal Tolerance Parameters - balanced for multi-robot navigation
  yaw_goal_tolerance: 0.3
  xy_goal_tolerance: 0.3
  latch_xy_goal_tolerance: true

  # Forward Simulation Parameters - maximum samples for tight spaces
  sim_time: 2.0  # Longer lookahead for tight spaces
  sim_granularity: 0.01  # Finer granularity for precise planning
  angular_sim_granularity: 0.01  # Finer angular granularity
  vx_samples: 12  # Many more velocity samples for better path selection
  vtheta_samples: 40  # Many more angular samples for tight turns
  controller_frequency: 20.0

  # Trajectory scoring parameters - balanced for safe multi-robot navigation
  meter_scoring: true
  occdist_scale:  0.1 # Increased obstacle avoidance for multi-robot safety
  pdist_scale: 3.0  # Path following weight
  gdist_scale: 2.0 # Goal distance weight

  heading_lookahead: 0.325  #How far to look ahead in meters when scoring different in-place-rotation trajectories
  heading_scoring: false  #Whether to score based on the robot's heading to the path or its distance from the path. default false
  heading_scoring_timestep: 0.8   #How far to look ahead in time in seconds along the simulated trajectory when using heading scoring (double, default: 0.8)
  dwa: false #Whether to use the Dynamic Window Approach (DWA)_ or whether to use Trajectory Rollout
  simple_attractor: false
  publish_cost_grid_pc: true  

  # Oscillation Prevention Parameters - relaxed to prevent false detection
  oscillation_reset_dist: 0.5 # Increased distance before oscillation flags reset
  escape_reset_dist: 0.2  # Increased escape reset distance
  escape_reset_theta: 0.2  # Increased escape reset angle

DWAPlannerROS:
  # Robot configuration parameters  
  acc_lim_x: 2.5
  acc_lim_y: 0
  acc_lim_th: 3.2

  max_vel_x: 0.5
  min_vel_x: 0.0
  max_vel_y: 0
  min_vel_y: 0

  max_vel_trans: 0.5
  min_vel_trans: 0.1
  max_vel_theta: 1.0
  min_vel_theta: 0.2

  # Goal Tolerance Parameters
  yaw_goal_tolerance: 0.2
  xy_goal_tolerance: 0.25
  latch_xy_goal_tolerance: false

