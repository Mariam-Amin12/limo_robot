recovery_behavior_enabled: true

controller_frequency: 20.0
# Balanced patience for multi-robot navigation
controller_patience: 15.0
planner_frequency: 1.0
planner_patience: 5.0

# Reset distance for costmap clearing
conservative_reset_dist: 3.0
# Oscillation detection parameters
oscillation_timeout: 10.0
oscillation_distance: 0.3
clearing_rotation_allowed:  true
# Allow planning through unknown space during exploration
allow_unknown: true

# Recovery behaviors to help robots recover from collisions and get unstuck
recovery_behaviors:
  - name: 'conservative_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'rotate_recovery'
    type: 'rotate_recovery/RotateRecovery'
  - name: 'aggressive_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'

# Recovery behavior parameters - more aggressive for stuck robots
conservative_reset:
  reset_distance: 3.0

aggressive_reset:
  reset_distance: 0.0

rotate_recovery:
  sim_granularity: 0.017
  frequency: 10.0
  default_rotational_vel: 1.0  # Balanced rotation speed
  min_rotational_vel: 0.4
  acc_lim_th: 3.2
  tolerance: 0.1
  max_rotational_vel: 1.0